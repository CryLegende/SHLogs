name: SHLogs
version: '${project.version}'
main: org.Cry_Legende.sHLogs.SHLogs
api-version: '1.20'
author: Cry_Legende

commands:
  shlogs:
    description: Ajoute une ligne dans un fichier de log
    usage: /<command> <dossier> <fichier> <message>

permissions:
  shlogs.use:
    description: Autorise l'ajout d'une ligne avec /shlogs
    default: op
  shlogs.reload:
    description: Autorise /shlogs reload
    default: op
