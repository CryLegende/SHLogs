name: SHLogs
version: '${project.version}'
main: org.Cry_Legende.sHLogs.SHLogs
api-version: '1.20'
author: Cry_Legende

commands:
  shlogs:
    description: Ajoute un message dans un fichier de log
    usage: /<commande> <fichier_sans_extention> <message>
    permission: shlogs.use
    permission-message: "Vous n'avez pas la permission pour utiliser cette commande."

permissions:
  shlogs.use:
    description: Autorise l'utilisation de la commande /shlogs
    default: op
